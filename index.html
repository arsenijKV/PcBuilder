<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PcBuilder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="script" href="script.js">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
 
<body>
    <header>
        <h1>PC Builder</h1>
        
    </header>
 
    <main>
        
        <nav>
            <h2>Комплектующие</h2>
            <ul>
                <li> <a href="#motherboard" data-category="motherboard">Мат. плата</a></li>
                <li> <a href="#cpu" data-category ="cpu">Просессор </a></li>
                <li> <a href="#gpu" data-category ="gpu">Видеокарта </a></li>
                <li> <a href="#ram" data-category ="ram">Оперативная Память </a></li>
                <li> <a href="#ssd" data-category ="storage"> Память </a></li>
                <li> <a href="#psu" data-category ="psu">Блок Питания </a></li>
                <li> <a href="#cooler" data-category ="cooler">Охлаждение </a></li>
                <li> <a href="#case" data-category ="case">Корпус</a></li>
            </ul>
        </nav>
 
        
        <article class="items">
            <div class="toolbar">
                <input type="search" id="search" placeholder="Поиск...">
                <select id="sort">
                    <option value="price-asc">Цена ↑</option>
                    <option value="price-desc">Цена ↓</option>
                    <option value="name">Название</option>
                </select>
            </div>
            <p id="status" class="status"></p>
            <div class="grid" id="grid"></div>
            <button id="more" class="btn more" hidden>Показать ещё</button>
        </article>
 
       
        <article class="cart">
            <h2>Твоя сборка </h2>
            <ul id="cartList"></ul>
            <div class="row"><span>Потребление(минус=запас)</span><strong id="watts" class="orange">0 W</strong></div>
            <div class="row"><span>Итого</span><strong id="total">$0</strong></div>
            <p id="warn" class="warn"></p>
            <div class="actions">
                <button class="btn ghost" id="clear">Очистить</button>
                <button class="btn" id="export">Экспорт JSON</button>
            </div>
        </article>
    </main>
 
    <footer>
        <h3>Verificated by Me</h3>
    </footer>
 
    <script src="script.js"></script>
    <script src="pc3d.js"></script>
</body>
</html>
